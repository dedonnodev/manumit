[project]
name = "miband"
version = "0.1.0"
description = "Phase 0 throwaway CLI: validates the Xiaomi Smart Band 10 protocol and produces PROTOCOL.md + packet fixtures for the Swift port."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "protobuf>=5",
    "cryptography>=42",
    "click>=8",
    "python-dotenv>=1",
    "winrt-Windows.Devices.Enumeration; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only needed by vendor/xiaomi_cloud/token_extractor.py (MIT, run as a
# subprocess by `miband auth-key`). Kept out of the default install so the
# main AGPL project doesn't carry MIT-tool-only deps.
xiaomi-cloud = [
    "requests>=2.31",
    "pycryptodome>=3.20",
    "Pillow>=10",
    "colorama>=0.4",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.62",
    "pytest>=8",
]

[project.scripts]
miband = "miband.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miband"]
